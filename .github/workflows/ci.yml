name: TripSwarm CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ libpq-dev curl

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: Lint & syntax check
        run: |
          python -m compileall -q \
            app.py backend.py database.py llm_providers.py \
            mcp_client.py models.py rag_backend.py tools/
          pip install flake8 --quiet
          flake8 app.py backend.py database.py llm_providers.py \
            mcp_client.py models.py rag_backend.py tools/ \
            --max-line-length=120 --ignore=E501,W503,E402 --count || true

      - name: Run tests
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx --quiet
          pytest tests/ \
            --junitxml=reports/test-results.xml \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Trigger Render deploy
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X GET "${{ secrets.RENDER_DEPLOY_HOOK_TRIPSWARM }}" \
            -w "\nHTTP_STATUS:%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Render returned: $HTTP_STATUS"
            exit 1
          fi
          echo "Render deployment triggered."